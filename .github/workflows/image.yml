name: Image

on:
  workflow_call:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/osa
  IMAGE_DASHBOARD: ghcr.io/${{ github.repository_owner }}/osa-dashboard

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      # Bake the MCP widget bundles into the server package before the Docker
      # build (context is server/, so the bundles must exist inside it). The
      # server serves them as ui://osa/* resources at /mcp (#162).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'pnpm'
          cache-dependency-path: packages/osa-widgets/pnpm-lock.yaml

      - name: Build widget bundles
        working-directory: packages/osa-widgets
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          mkdir -p ../../server/osa/application/api/mcp/bundles
          cp dist/*.html ../../server/osa/application/api/mcp/bundles/

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          TAGS="${{ env.IMAGE }}:sha-${SHA_SHORT}"
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAGS="${TAGS},${{ env.IMAGE }}:${{ github.event.release.tag_name }}"
          fi
          if [[ -n "${{ github.event.pull_request.number }}" ]]; then
            TAGS="${TAGS},${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: server
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OSA_VERSION=${{ github.event.release.tag_name || github.sha }}
            OSA_REVISION=${{ github.sha }}

  # Self-hostable management dashboard (#173). Built as a self-host image
  # (IS_PLATFORM=false); the CLI pulls it by release tag via OSA_IMAGE_VERSION.
  dashboard:
    name: Dashboard - Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          TAGS="${{ env.IMAGE_DASHBOARD }}:sha-${SHA_SHORT}"
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAGS="${TAGS},${{ env.IMAGE_DASHBOARD }}:${{ github.event.release.tag_name }}"
          fi
          if [[ -n "${{ github.event.pull_request.number }}" ]]; then
            TAGS="${TAGS},${{ env.IMAGE_DASHBOARD }}:pr-${{ github.event.pull_request.number }}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: apps/dashboard
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
          build-args: |
            NEXT_PUBLIC_IS_PLATFORM=false
            NEXT_PUBLIC_API_MODE=real
