name: Server Image

on:
  workflow_call:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/osa

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      # Bake the MCP widget bundles into the server package before the Docker
      # build (context is server/, so the bundles must exist inside it). The
      # server serves them as ui://osa/* resources at /mcp (#162).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'pnpm'
          cache-dependency-path: packages/osa-widgets/pnpm-lock.yaml

      - name: Build widget bundles
        working-directory: packages/osa-widgets
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          mkdir -p ../../server/osa/application/api/mcp/bundles
          cp dist/*.html ../../server/osa/application/api/mcp/bundles/

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        # Pass event metadata through env, never interpolated into the script —
        # a release tag / branch name is untrusted input, and `${{ }}` inside a
        # run block would let shell syntax in it execute under packages:write.
        env:
          IMAGE: ${{ env.IMAGE }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          SHA_SHORT="${SHA:0:7}"
          TAGS="${IMAGE}:sha-${SHA_SHORT}"
          if [[ "${EVENT_NAME}" == "release" ]]; then
            TAGS="${TAGS},${IMAGE}:${RELEASE_TAG}"
          fi
          if [[ -n "${PR_NUMBER}" ]]; then
            TAGS="${TAGS},${IMAGE}:pr-${PR_NUMBER}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: server
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OSA_VERSION=${{ github.event.release.tag_name || github.sha }}
            OSA_REVISION=${{ github.sha }}
